[screen-time]
# "local" follows the system timezone. An IANA name such as
# America/New_York pins the schedule to that zone.
timezone = local
user = chalkboard
warning_minutes = 5
grace_seconds = 30

[schedule]
# Use comma-separated 24-hour windows. A window may cross midnight.
# Empty values mean that no downtime is configured for that day.
monday =
tuesday =
wednesday =
thursday =
friday =
saturday =
sunday =
