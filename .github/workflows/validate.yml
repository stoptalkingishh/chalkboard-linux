name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils shellcheck
      - name: Run checks
        run: bash tests/static.sh
